<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23272F">
<title>Quadro de Discursantes</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root{
    --bg: #FAF8F5;
    --ink: #23272F;
    --ink-soft: #6B7280;
    --card: #FFFFFF;
    --line: #E7E2D9;
    --c1: #6B9080;   /* Iniciante - 5 min */
    --c1-bg: #EAF1EE;
    --c2: #C98A2C;   /* Intermediário - 10 min */
    --c2-bg: #FBF0DE;
    --c3: #3B4C6B;   /* Experiente - 15 min */
    --c3-bg: #E7EBF1;
    --danger: #B3492C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  h1{
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle{
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin-top: 14px;
  }
  .updated{
    font-size: 12px;
    color: var(--ink-soft);
  }
  button.refresh{
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
  }
  button.refresh:active{ transform: scale(0.97); }

  main{
    max-width: 760px;
    margin: 0 auto;
    padding: 18px 16px 0;
    display:flex;
    flex-direction:column;
    gap: 20px;
  }

  .category{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .category-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 14px 18px;
  }
  .category-head h2{
    font-size: 16px;
    margin: 0;
  }
  .category-head .minutes{
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .cat-1 .category-head{ background: var(--c1-bg); }
  .cat-1 .minutes{ background: var(--c1); color: white; }
  .cat-2 .category-head{ background: var(--c2-bg); }
  .cat-2 .minutes{ background: var(--c2); color: white; }
  .cat-3 .category-head{ background: var(--c3-bg); }
  .cat-3 .minutes{ background: var(--c3); color: white; }

  ul.people{
    list-style:none;
    margin:0;
    padding:0;
  }
  li.person{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    gap: 10px;
  }
  li.person:first-child{ border-top:none; }
  .rank{
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink-soft);
    width: 18px;
    flex-shrink:0;
  }
  .name{
    font-weight: 600;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .last{
    font-size: 12px;
    color: var(--ink-soft);
    text-align:right;
    flex-shrink:0;
  }
  li.suggested{
    background: linear-gradient(to right, rgba(217,119,87,0.08), transparent);
  }
  li.suggested .name::after{
    content: "★ sugerido";
    margin-left: 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--danger);
    white-space:nowrap;
  }

  .empty, .state{
    padding: 30px 18px;
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .state.error{ color: var(--danger); }

  footer{
    max-width: 760px;
    margin: 24px auto 0;
    padding: 0 16px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>Quadro de Discursantes</h1>
  <p class="subtitle">Ordenado por tempo desde o último discurso em cada categoria</p>
  <div class="toolbar">
    <span class="updated" id="updated">carregando…</span>
    <button class="refresh" id="refreshBtn">Atualizar</button>
  </div>
</header>

<main id="app">
  <div class="state" id="loadingState">Buscando dados da planilha…</div>
</main>

<footer>
  Dados lidos diretamente da planilha do Google Sheets. Edite <code>SHEET_CSV_URL</code> em <code>app.js</code> para conectar a sua planilha.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW falhou:", err));
    });
  }
</script>
</body>
</html>
